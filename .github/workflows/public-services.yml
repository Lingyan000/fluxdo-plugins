name: 公开服务契约
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: read
jobs:
  public-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node tools/check-public-services.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-service-contract
          path: artifacts/public-contract.json
